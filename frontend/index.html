<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>TicketKaton · Bus, train and launch tickets (academic demo)</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Splash screen: plain HTML and CSS so it shows instantly, before the app has loaded. -->
    <style>
      #boot-splash {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: radial-gradient(900px 500px at 80% 0%, rgba(45,212,191,.22), transparent 60%),
                    linear-gradient(160deg, #042f2e 0%, #0b3b5b 100%);
        color: #ecfeff; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity .45s ease, visibility .45s ease;
      }
      #boot-splash.hide { opacity: 0; visibility: hidden; }
      #boot-splash .bs-brand { display: flex; align-items: center; gap: 12px; font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
      #boot-splash .bs-mark { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: #14b8a6; }
      #boot-splash .bs-brand span:last-child { color: #5eead4; }
      #boot-splash svg { width: min(340px, 82vw); height: auto; color: #ccfbf1; overflow: hidden; }
      #boot-splash .bs-bar { width: min(240px, 60vw); height: 4px; border-radius: 2px; background: rgba(255,255,255,.15); overflow: hidden; }
      #boot-splash .bs-bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: linear-gradient(90deg, #2dd4bf, #5eead4); animation: bs-slide 1.2s ease-in-out infinite; }
      #boot-splash p { margin: 0; font-size: 14px; opacity: .8; letter-spacing: .02em; }
      .bs-sky { animation: bs-scroll 3s linear infinite; }
      .bs-road { animation: bs-dash .6s linear infinite; }
      .bs-bus { animation: bs-bounce .45s ease-in-out infinite alternate; }
      .bs-wheel { transform-box: fill-box; transform-origin: center; animation: bs-spin .7s linear infinite; }
      @keyframes bs-slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(300%); } }
      @keyframes bs-scroll { to { transform: translateX(-60px); } }
      @keyframes bs-dash { to { stroke-dashoffset: -26; } }
      @keyframes bs-bounce { to { transform: translateY(-1.6px); } }
      @keyframes bs-spin { to { transform: rotate(360deg); } }
      #boot-splash [data-scene] { display: none; }
      #boot-splash[data-type='bus'] [data-scene='bus'],
      #boot-splash[data-type='train'] [data-scene='train'],
      #boot-splash[data-type='launch'] [data-scene='launch'] { display: inline; }
      .bs-sleepers { animation: bs-sleep .45s linear infinite; }
      .bs-wave { animation: bs-waveanim 1.1s linear infinite; }
      .bs-boat { transform-box: fill-box; transform-origin: center; animation: bs-bob 1.1s ease-in-out infinite alternate; }
      .bs-smoke circle { transform-box: fill-box; transform-origin: center; opacity: 0; animation: bs-puff 1.8s ease-out infinite; }
      .bs-smoke circle:nth-child(2) { animation-delay: .6s; }
      .bs-smoke circle:nth-child(3) { animation-delay: 1.2s; }
      @keyframes bs-sleep { to { stroke-dashoffset: -14; } }
      @keyframes bs-waveanim { to { transform: translateX(-30px); } }
      @keyframes bs-bob { to { transform: translateY(-2.5px) rotate(-1deg); } }
      @keyframes bs-puff { 0% { transform: translate(0,0) scale(.6); opacity: .7; } 100% { transform: translate(8px,-18px) scale(1.5); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { #boot-splash * { animation: none !important; } }
    </style>
  </head>
  <body>
    <div id="boot-splash" data-type="bus" role="status" aria-label="Loading TicketKaton">
      <div class="bs-brand">
        <span class="bs-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:24px;height:24px"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2M13 17v2M13 11v2"/></svg>
        </span>
        <div>Ticket<span>Katon</span></div>
      </div>

      <svg viewBox="0 0 300 110" role="img" aria-label="A vehicle on its way">
        <defs>
          <pattern id="bs-skyline" width="60" height="40" patternUnits="userSpaceOnUse">
            <rect x="2" y="14" width="14" height="26" fill="currentColor" opacity=".16"/>
            <rect x="20" y="4" width="12" height="36" fill="currentColor" opacity=".24"/>
            <rect x="36" y="20" width="10" height="20" fill="currentColor" opacity=".16"/>
            <rect x="48" y="10" width="10" height="30" fill="currentColor" opacity=".2"/>
          </pattern>
          <pattern id="bs-trees" width="60" height="30" patternUnits="userSpaceOnUse">
            <circle cx="12" cy="16" r="9" fill="currentColor" opacity=".18"/>
            <circle cx="34" cy="12" r="12" fill="currentColor" opacity=".24"/>
            <circle cx="52" cy="18" r="8" fill="currentColor" opacity=".16"/>
          </pattern>
          <pattern id="bs-wavep" width="30" height="8" patternUnits="userSpaceOnUse">
            <path d="M0 4q7.5-6 15 0t15 0" fill="none" stroke="currentColor" stroke-width="2" opacity=".5"/>
          </pattern>
        </defs>

        <g data-scene="bus">
          <rect class="bs-sky" x="0" y="46" width="360" height="40" fill="url(#bs-skyline)"/>
          <g class="bs-bus">
            <rect x="104" y="46" width="108" height="38" rx="9" fill="#14b8a6"/>
            <rect x="104" y="46" width="108" height="38" rx="9" fill="none" stroke="#ccfbf1" stroke-width="2"/>
            <rect x="112" y="53" width="16" height="12" rx="3" fill="#ccfbf1" opacity=".85"/>
            <rect x="132" y="53" width="16" height="12" rx="3" fill="#ccfbf1" opacity=".85"/>
            <rect x="152" y="53" width="16" height="12" rx="3" fill="#ccfbf1" opacity=".85"/>
            <rect x="172" y="53" width="16" height="12" rx="3" fill="#ccfbf1" opacity=".85"/>
            <rect x="192" y="53" width="14" height="22" rx="3" fill="#ccfbf1"/>
            <line x1="104" y1="72" x2="212" y2="72" stroke="#ccfbf1" stroke-width="2"/>
            <g class="bs-wheel"><circle cx="132" cy="86" r="8" fill="#042f2e" stroke="#ccfbf1" stroke-width="2"/><line x1="132" y1="81" x2="132" y2="91" stroke="#ccfbf1" stroke-width="1.5"/><line x1="127" y1="86" x2="137" y2="86" stroke="#ccfbf1" stroke-width="1.5"/></g>
            <g class="bs-wheel"><circle cx="186" cy="86" r="8" fill="#042f2e" stroke="#ccfbf1" stroke-width="2"/><line x1="186" y1="81" x2="186" y2="91" stroke="#ccfbf1" stroke-width="1.5"/><line x1="181" y1="86" x2="191" y2="86" stroke="#ccfbf1" stroke-width="1.5"/></g>
          </g>
          <line class="bs-road" x1="-20" y1="98" x2="320" y2="98" stroke="#ccfbf1" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 12" opacity=".7"/>
        </g>

        <g data-scene="train">
          <rect class="bs-sky" x="0" y="40" width="360" height="40" fill="url(#bs-skyline)"/>
          <g class="bs-bus">
            <rect x="36" y="50" width="68" height="34" rx="6" fill="#14b8a6"/>
            <rect x="44" y="57" width="10" height="10" rx="2" fill="#ccfbf1"/><rect x="58" y="57" width="10" height="10" rx="2" fill="#ccfbf1"/><rect x="72" y="57" width="10" height="10" rx="2" fill="#ccfbf1"/><rect x="86" y="57" width="10" height="10" rx="2" fill="#ccfbf1"/>
            <rect x="108" y="50" width="68" height="34" rx="6" fill="#14b8a6"/>
            <rect x="116" y="57" width="10" height="10" rx="2" fill="#ccfbf1"/><rect x="130" y="57" width="10" height="10" rx="2" fill="#ccfbf1"/><rect x="144" y="57" width="10" height="10" rx="2" fill="#ccfbf1"/><rect x="158" y="57" width="10" height="10" rx="2" fill="#ccfbf1"/>
            <path d="M180 50h46c16 0 32 12 36 34h-82z" fill="#0d9488"/>
            <rect x="190" y="57" width="24" height="12" rx="2" fill="#ccfbf1"/>
            <circle cx="257" cy="76" r="2.5" fill="#fde68a"/>
            <g class="bs-wheel"><circle cx="52" cy="88" r="5" fill="#042f2e" stroke="#ccfbf1" stroke-width="2"/></g>
            <g class="bs-wheel"><circle cx="88" cy="88" r="5" fill="#042f2e" stroke="#ccfbf1" stroke-width="2"/></g>
            <g class="bs-wheel"><circle cx="124" cy="88" r="5" fill="#042f2e" stroke="#ccfbf1" stroke-width="2"/></g>
            <g class="bs-wheel"><circle cx="160" cy="88" r="5" fill="#042f2e" stroke="#ccfbf1" stroke-width="2"/></g>
            <g class="bs-wheel"><circle cx="198" cy="88" r="5" fill="#042f2e" stroke="#ccfbf1" stroke-width="2"/></g>
            <g class="bs-wheel"><circle cx="240" cy="88" r="5" fill="#042f2e" stroke="#ccfbf1" stroke-width="2"/></g>
          </g>
          <line x1="-20" y1="94.5" x2="320" y2="94.5" stroke="#ccfbf1" stroke-width="2" opacity=".6"/>
          <line class="bs-sleepers" x1="-20" y1="100" x2="320" y2="100" stroke="#ccfbf1" stroke-width="4" stroke-dasharray="5 9" opacity=".4"/>
        </g>

        <g data-scene="launch">
          <rect class="bs-sky" x="0" y="46" width="360" height="30" fill="url(#bs-trees)"/>
          <rect x="0" y="78" width="300" height="32" fill="#14b8a6" opacity=".12"/>
          <g class="bs-boat">
            <path d="M92 76h124l-16 15h-92z" fill="#14b8a6"/>
            <rect x="104" y="62" width="96" height="14" rx="3" fill="#ccfbf1"/>
            <rect x="112" y="66" width="9" height="6" rx="1.5" fill="#0f766e" opacity=".8"/><rect x="128" y="66" width="9" height="6" rx="1.5" fill="#0f766e" opacity=".8"/><rect x="144" y="66" width="9" height="6" rx="1.5" fill="#0f766e" opacity=".8"/><rect x="160" y="66" width="9" height="6" rx="1.5" fill="#0f766e" opacity=".8"/><rect x="176" y="66" width="9" height="6" rx="1.5" fill="#0f766e" opacity=".8"/>
            <rect x="120" y="50" width="64" height="12" rx="3" fill="#99f6e4"/>
            <rect x="140" y="40" width="26" height="10" rx="2" fill="#ccfbf1"/>
            <rect x="150" y="29" width="8" height="11" fill="#0d9488"/>
            <g class="bs-smoke" fill="#cbd5e1"><circle cx="154" cy="26" r="3"/><circle cx="154" cy="26" r="3"/><circle cx="154" cy="26" r="3"/></g>
          </g>
          <rect class="bs-wave" x="0" y="87" width="360" height="8" fill="url(#bs-wavep)"/>
          <rect class="bs-wave" x="0" y="96" width="360" height="8" fill="url(#bs-wavep)" opacity=".6"/>
        </g>
      </svg>

      <div class="bs-bar"><i></i></div>
      <p>Getting your journey ready…</p>
    </div>

    <script>
      try {
        var t = sessionStorage.getItem('tk:type');
        if (t === 'bus' || t === 'train' || t === 'launch') document.getElementById('boot-splash').setAttribute('data-type', t);
      } catch (e) {}
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
